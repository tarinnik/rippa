[workspace]
members = ["makemkv", "rippa"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
askama = "0.15.6"
axum = { version = "0.8.8", features = ["macros"] }
flate2 = "1.1.9"
log = "0.4.29"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["io-util"] }
zerocopy = { version = "0.8.48", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
