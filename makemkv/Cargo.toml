[package]
edition = "2024"
name = "makemkv"
version = "0.1.0"

[dependencies]
anyhow = "1.0.102"
askama = "0.14.0"
axum = { version = "0.8.7", features = ["macros"] }
log = "0.4.29"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
] }
zerocopy = { version = "0.8.30", features = ["derive"] }
