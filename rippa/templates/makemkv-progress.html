{% if status == MakeMkvStatus::Ripping %}
<div hx-get="/makemkv/progress" hx-target="#makemkv-rip" hx-trigger="load delay:1s">
    <p>Ripping... <progress max="100" value="{{total_progress}}">{{total_progress}}%</progress> {{total_progress}}%</p>
</div>
{% else if status == MakeMkvStatus::LoadedData || status == MakeMkvStatus::Done %}
<div class="inline">
    <button type="submit" form="disk-data" class="icon">
        <img src="/assets/svg/save.svg"></img>
    </button>
    {% if status == MakeMkvStatus::Done %}
    <p id="rip-done">Done</p>
    {% endif %}
</div>
{% endif %}
